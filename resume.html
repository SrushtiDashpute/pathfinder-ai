<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Analyzer — PathFinder</title><link rel="stylesheet" href="/style.css"></head><body>
<nav><a class="logo" href="/">PathFinder</a><div class="navlinks"><a href="/">Home</a><a href="/explore.html">Explore</a><a href="/interview.html">Interview</a><a href="/dashboard.html">Dashboard</a></div></nav><header class="pagehead"><h1>AI Resume Analyzer</h1><p>Upload a PDF/TXT resume or paste your text.</p></header><main class="container"><div class="formbox"><form id="rf"><label>Resume file</label><input type="file" id="resume" accept=".pdf,.txt"><label>Or paste resume text</label><textarea id="resumeText"></textarea><br><button class="btn" type="submit">Analyze Resume</button></form><div id="resumeResult" class="result" style="display:none"></div></div></main><script>
document.getElementById("rf").addEventListener("submit",async e=>{e.preventDefault();let fd=new FormData();let f=document.getElementById("resume").files[0];if(f)fd.append("resume",f);fd.append("resume_text",document.getElementById("resumeText").value);let box=document.getElementById("resumeResult");box.style.display="block";box.textContent="Analyzing...";try{let r=await fetch("/api/resume",{method:"POST",body:fd});let d=await r.json();box.textContent=d.answer||d.error}catch(x){box.textContent="Could not connect. Start Flask with python app.py."}});
</script></body></html>
